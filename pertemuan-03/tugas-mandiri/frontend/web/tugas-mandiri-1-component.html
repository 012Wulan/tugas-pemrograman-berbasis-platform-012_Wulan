<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kartu Profil - Component Based</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 24px;
            font-family: Arial, sans-serif;
            background: #fff0f5;
            color: #831843;
        }

        .container {
            width: 100%;
            max-width: 400px;
            margin: 30px auto;
        }

        .card {
            padding: 24px;
            text-align: center;
            background: white;
            border: 1px solid #fbcfe8;
            border-radius: 16px;
            box-shadow: 0 4px 12px #ec489926;
        }

        .card-photo {
            width: 110px;
            height: 110px;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid #f9a8d4;
        }

        .card-name {
            margin: 16px 0 8px;
            font-size: 24px;
            overflow-wrap: anywhere;
            color: #be185d;
        }

        .card-nim {
            margin-bottom: 20px;
            color: #9d6680;
        }

        .btn {
            display: inline-block;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            background: #ec4899;
            color: white;
            text-decoration: none;
            cursor: pointer;
        }

        .btn:hover {
            background: #be185d;
        }

        @media (max-width: 400px) {
            body {
                padding: 16px;
            }

            .card {
                padding: 20px;
            }

            .card-name {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <main class="container">
        <article class="card">
            <img
                class="card-photo"
                src="wu.jpg"
                alt="Foto profil Septiana Wulandari"
            >

            <h1 class="card-name">Septiana Wulandari</h1>
            <p class="card-nim">NIM: 2024520012</p>

            <a class="btn" href="#profil">Lihat Profil</a>
        </article>
    </main>
</body>
</html>
